version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
tasks:
  run:
    desc: Build and launch the selected preset with CLI arguments
    cmds:
    - task: build
      vars:
        PRESET: '{{.PRESET}}'
    - build/{{.PRESET}}/apps/files/hn-files {{.CLI_ARGS}}
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  qml-import-check:
    desc: Check runtime-control import policy
    cmds:
    - python3 scripts/check-qml-import-policy.py
    - python3 scripts/check-qml-import-policy.py libs/file-browser/qml
  qmltypes-check:
    desc: Check generated application QML metadata
    cmds:
    - cmake --build build/{{.PRESET}} --target qmltypes-check
  qml-lint:
    desc: qml-lint
    cmds:
    - cmake --build build/{{.PRESET}} --target qml-lint
  license-check:
    desc: Check license metadata with REUSE
    cmds:
    - reuse lint
  install-check:
    desc: Stage Release and verify installed payload and desktop launch
    cmds:
    - task: build
      vars:
        PRESET: release
    - bash scripts/check-install.sh
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  clean:
    desc: Remove Files debug/release/test build directories, preserving provider installs
    cmds:
    - rm -rf -- build/dev build/release build/dev
  isolated-runtime-check:
    desc: Build in a fresh CI container and verify its installed payload without networking
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
  visual-check:
    desc: Capture dark/light renders at normal and fractional scale for inspection
    cmds:
    - task: build
      vars:
        PRESET: dev
    - bash scripts/check-visual.sh
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - ctest --preset dev {{.CLI_ARGS}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  tidy:
    desc: tidy
    cmds:
    - python3 scripts/quality.py tidy --build build/{{.PRESET}}
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
