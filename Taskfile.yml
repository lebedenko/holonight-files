version: '3'
vars:
  PRESET: '{{default "debug" .PRESET}}'
  HOLONIGHT_DEPENDENCY_PREFIX: '{{default (printf "%s/build/deps/prefix" .ROOT_DIR) .HOLONIGHT_DEPENDENCY_PREFIX}}'
  HOLONIGHT_QML_IMPORT_PATH: '{{default (printf "%s/lib/qt6/qml" .HOLONIGHT_DEPENDENCY_PREFIX) .HOLONIGHT_QML_IMPORT_PATH}}'
env:
  HOLONIGHT_DEPENDENCY_PREFIX: '{{.HOLONIGHT_DEPENDENCY_PREFIX}}'
  HOLONIGHT_QML_IMPORT_PATH: '{{.HOLONIGHT_QML_IMPORT_PATH}}'
  QML_IMPORT_PATH: '{{.HOLONIGHT_QML_IMPORT_PATH}}'
  LD_LIBRARY_PATH: '{{.HOLONIGHT_DEPENDENCY_PREFIX}}/lib'
tasks:
  deps:
    desc: Refresh changed sibling providers in the project-local prefix
    cmds: ['bash scripts/prepare-deps.sh']
  configure:
    desc: Configure the selected build preset
    cmds: ['cmake --preset {{.PRESET}} -DCMAKE_PREFIX_PATH="{{.HOLONIGHT_DEPENDENCY_PREFIX}}" -DQML_IMPORT_PATH="{{.HOLONIGHT_QML_IMPORT_PATH}}"']
  build:
    desc: Configure and build the selected preset
    deps: [deps]
    cmds:
      - task: configure
        vars: {PRESET: '{{.PRESET}}'}
      - cmake --build --preset {{.PRESET}}
  run:
    desc: Build and launch the selected preset with CLI arguments
    cmds:
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
      - build/{{.PRESET}}/apps/files/hn-files {{.CLI_ARGS}}

  test:
    desc: Build and run tests
    cmds:
      - task: build
        vars: {PRESET: test}
      - ctest --preset test
  format:
    desc: Format recursive C++ and QML sources
    cmds: ['python3 scripts/format-sources.py']
  format-check:
    desc: Check recursive C++ and QML formatting
    cmds: ['python3 scripts/format-sources.py --check']
  qml-import-check:
    desc: Check runtime-control import policy
    cmds: ['python3 scripts/check-qml-import-policy.py']
  qmltypes-check:
    desc: Check generated application QML metadata
    cmds: ['cmake --build build/{{.PRESET}} --target qmltypes-check']
  tidy:
    desc: Run C++ clang-tidy checks
    cmds:
      - task: build
        vars: {PRESET: test}
      - cmake --build build/test --target tidy
  qml-lint:
    desc: Run QML lint checks
    deps: [build]
    cmds: ['cmake --build build/{{.PRESET}} --target qml-lint']
  lint:
    desc: Run C++ and QML lint checks
    cmds:
      - task: tidy
      - task: qml-lint
  license-check:
    desc: Check license metadata with REUSE
    cmds: [reuse lint]
  install-check:
    desc: Stage Release and verify installed payload and desktop launch
    cmds:
      - task: build
        vars: {PRESET: release}
      - bash scripts/check-install.sh
  check:
    desc: Sequentially build, test, check formatting, lint, licenses, staged installation
    aliases: [verify]
    cmds:
      - task: build
        vars: {PRESET: debug}
      - task: build
        vars: {PRESET: release}
      - task: test
      - task: format-check
      - task: lint
      - task: license-check
      - task: install-check
      - task: qml-import-check
      - task: qmltypes-check
  clean:
    desc: Remove Files debug/release/test build directories, preserving provider installs
    cmds:
      - rm -rf -- build/debug build/release build/test
  isolated-runtime-check:
    desc: Build and verify the installed payload in a disposable, network-isolated container
    cmds:
      - task: build
        vars: {PRESET: release}
      - bash scripts/prepare-runtime-check.sh
      - docker build -t holonight-files-runtime-check "$(cat build/runtime-check-context)"
      - docker run --rm --network none holonight-files-runtime-check
  visual-check:
    desc: Capture dark/light renders at normal and fractional scale for inspection
    cmds:
      - task: build
        vars: {PRESET: test}
      - bash scripts/check-visual.sh
