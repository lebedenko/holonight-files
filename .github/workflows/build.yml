name: Build and checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [build, isolation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: files
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 03fa635cedc506e101a148fc54f7eb46d17c6de5
          path: holonight-config
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 61d0c16af689e960367fd0f631f2c88afa169441
          path: holonight-qt
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-images
          ref: ac11f23e9ff2d70b1c142b643bc2abb6dd69f6c1
          path: holonight-images
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-thumbnails
          ref: d27addc044f277686850588147ec825c40c0f252
          path: holonight-thumbnails
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-system-services
          ref: f93ae00fcb850426c433e4e9f97b569979f330d6
          path: holonight-system-services
      - name: Build CI image locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/build
          docker build -t files-ci -f files/packaging/Dockerfile.ci files \
            2>&1 | tee files/build/ci-image.log
      - name: Build and verify
        if: matrix.lane == 'build'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/build
          docker run --rm -v "$GITHUB_WORKSPACE:/work" files-ci \
            bash -euc 'trap "chown -R $(stat -c %u:%g /work/files) /work/files/build" EXIT;
            for source in /work/files /work/holonight-config /work/holonight-qt /work/holonight-images /work/holonight-thumbnails /work/holonight-system-services; do
              git config --system --add safe.directory "$source";
            done;
            task deps;
            chown -R files-test:files-test /work/files/build;
            runuser -u files-test -- env LC_ALL=C.UTF-8 task check;
            runuser -u files-test -- env LC_ALL=en_US.UTF-8 task test;
            runuser -u files-test -- bash scripts/prepare-runtime-check.sh' \
            2>&1 | tee files/build/ci-check.log
      - name: Build isolated runtime image
        if: matrix.lane == 'build'
        working-directory: files
        shell: bash
        run: |
          set -euo pipefail
          docker build -t holonight-files-runtime-check "$(cat build/runtime-check-context)" \
            2>&1 | tee build/ci-runtime-build.log
      - name: Verify isolated runtime
        if: matrix.lane == 'build'
        working-directory: files
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none holonight-files-runtime-check \
            2>&1 | tee build/ci-runtime.log
          python3 scripts/check-runtime-fixtures.py holonight-files-runtime-check \
            2>&1 | tee build/ci-runtime-fixtures.log
      - name: Build filesystem isolation tests
        if: matrix.lane == 'isolation'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" files-ci \
            bash -euc 'trap "chown -R $(stat -c %u:%g /work/files) /work/files/build" EXIT;
            for source in /work/files /work/holonight-config /work/holonight-qt /work/holonight-images /work/holonight-thumbnails /work/holonight-system-services; do
              git config --system --add safe.directory "$source";
            done;
            task deps;
            chown -R files-test:files-test /work/files/build;
            runuser -u files-test -- task configure PRESET=test;
            runuser -u files-test -- cmake --build --preset test --target files-fsops-smoke files-fsops-window-smoke' \
            2>&1 | tee files/build/ci-isolation-build.log
      - name: Require filesystem isolation coverage
        if: matrix.lane == 'isolation'
        shell: bash
        run: |
          set -euo pipefail
          # Only the namespace tests receive these exceptions. They run unprivileged
          # without networking; no daemon socket or host devices are mounted.
          security_args=(--security-opt seccomp=unconfined)
          if [[ -r /sys/module/apparmor/parameters/enabled ]] &&
             [[ $(cat /sys/module/apparmor/parameters/enabled) == Y ]]; then
            sudo apparmor_parser -r files/packaging/apparmor.files-isolation
            security_args+=(--security-opt apparmor=holonight-files-isolation)
          fi
          docker run --rm --network none "${security_args[@]}" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e FILES_REQUIRE_FS_ISOLATION=1 \
            -v "$GITHUB_WORKSPACE:/work" files-ci \
            ctest --preset test -R '^files-fsops' -V \
            2>&1 | tee files/build/ci-isolation.log
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-verification-${{ matrix.lane }}
          path: |
            files/build/*.log
            files/build/test/Testing/Temporary/
            files/build/install-check.*/runtime.log
            files/build/runtime-fixtures.*/*.log
