name: Build and checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [build, isolation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable runner isolation policy
        if: matrix.lane == 'isolation'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -r /sys/module/apparmor/parameters/enabled ]] &&
             [[ $(cat /sys/module/apparmor/parameters/enabled) == Y ]]; then
            sudo apparmor_parser -r packaging/apparmor.files-isolation
          fi
      - run: python3 scripts/ci/run.py --lane ${{ matrix.lane }}
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-verification-${{ matrix.lane }}
          path: |
            build/ci/
            !build/ci/**/artifacts/**/runtime-context/**
            !build/ci/**/artifacts/isolation/files/**
            !build/ci/**/artifacts/isolation/packages/**
